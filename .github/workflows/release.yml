name: Release

# Roda a cada push na main (merge do PR release/* -> main).
# Calcula a versão com .github/scripts/proxima-versao.sh (a mesma regra usada
# para nomear a branch release/*), gera o APK/AAB e publica a tag + GitHub Release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build e publicação da release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular versão
        id: versao
        run: bash .github/scripts/proxima-versao.sh

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore de release configurada."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 não configurado: o APK será assinado com a chave de debug."
          fi

      - name: Testes unitários
        run: ./gradlew testReleaseUnitTest -PVERSION_NAME=${{ steps.versao.outputs.version }} -PVERSION_CODE=${{ steps.versao.outputs.code }}

      - name: Build de release (APK e AAB)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease -PVERSION_NAME=${{ steps.versao.outputs.version }} -PVERSION_CODE=${{ steps.versao.outputs.code }}

      - name: Renomear artefatos
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/financas-${{ steps.versao.outputs.tag }}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/financas-${{ steps.versao.outputs.tag }}.aab"

      - name: Criar tag e GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.versao.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Finanças ${{ steps.versao.outputs.tag }}" \
            --generate-notes
