name: Release

# Roda a cada push na main (no gitflow: merge de release/* ou hotfix/*).
# Lê VERSION_NAME do gradle.properties, gera o APK/AAB de release e
# cria a tag v<versão> com uma GitHub Release. Se a tag já existir, não faz nada.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build e publicação da release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler versão
        id: versao
        run: |
          VERSION=$(grep -E '^VERSION_NAME=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::VERSION_NAME não encontrado em gradle.properties"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A tag v$VERSION já existe. Atualize VERSION_NAME para gerar uma nova release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configurar JDK 17
        if: steps.versao.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        if: steps.versao.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar keystore de assinatura
        if: steps.versao.outputs.exists == 'false'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore de release configurada."
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 não configurado: o APK será assinado com a chave de debug."
          fi

      - name: Testes unitários
        if: steps.versao.outputs.exists == 'false'
        run: ./gradlew testReleaseUnitTest

      - name: Build de release (APK e AAB)
        if: steps.versao.outputs.exists == 'false'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease

      - name: Renomear artefatos
        if: steps.versao.outputs.exists == 'false'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/financas-${{ steps.versao.outputs.tag }}.apk"
          cp app/build/outputs/bundle/release/*.aab "dist/financas-${{ steps.versao.outputs.tag }}.aab"

      - name: Criar tag e GitHub Release
        if: steps.versao.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.versao.outputs.tag }}" dist/* \
            --target "$GITHUB_SHA" \
            --title "Finanças ${{ steps.versao.outputs.tag }}" \
            --generate-notes
